name: History data

# Finds (and later downloads) historical files for the History page. Run by hand.
on:
  workflow_dispatch:
    inputs:
      step:
        description: "discover or download"
        required: true
        default: "discover"

permissions:
  contents: write

jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pyyaml playwright && python -m playwright install --with-deps chromium
      - name: Discover
        if: inputs.step == 'discover'
        run: python fetch/history/discover_history.py
      - name: Download
        if: inputs.step == 'download'
        run: python fetch/history/download_history.py
      - name: Keep the downloaded files as a release
        if: inputs.step == 'download'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="history-raw"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Historical source files" --notes "Unchanged copies of historical federal files." --prerelease
          gh release upload "$TAG" fetch/history/raw/* --clobber
      - name: Save the report
        if: always()
        run: |
          git config user.name "IDEA Atlas bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fetch/reports
          git diff --cached --quiet || git commit -m "History report [skip ci]"
          git pull --rebase
          git push
