name: Publish atlas.sumanrath.org

# Builds the site and publishes it with GitHub Pages at atlas.sumanrath.org.
# Runs after new data is cleaned, when the site code changes, or by hand.
on:
  push:
    branches: [main]
    paths:
      - "build/**"
      - ".github/workflows/pages.yml"
  workflow_run:
    workflows: ["Clean and join data"]
    types: [completed]
  workflow_dispatch:
    inputs:
      preview:
        description: "Keep search engines out (yes only for a private review)"
        required: true
        default: "no"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy markdown pillow fonttools brotli
      - name: Build the site
        env:
          ATLAS_BASE: /
          ATLAS_ORIGIN: https://atlas.sumanrath.org
          # Visitor counter (GoatCounter account sumanrath.goatcounter.com, no cookies).
          ATLAS_GOATCOUNTER: ${{ vars.ATLAS_GOATCOUNTER || 'sumanrath' }}
        run: |
          # Search engines stay out until launch is approved (change the default below at launch).
          if [ "${{ github.event.inputs.preview || 'no' }}" = "no" ]; then python build/site.py; else python build/site.py --preview; fi
          N=$(ls site/district | wc -l); echo "district pages: $N"; test "$N" -gt 15000
          # GitHub Pages sites should stay under 1 GB. Warn well before that.
          MB=$(du -sm site | cut -f1); echo "site size: ${MB} MB"
          if [ "$MB" -gt 950 ]; then echo "::warning::The atlas is ${MB} MB, close to the 1 GB GitHub Pages limit."; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.last.outputs.page_url || steps.retry.outputs.page_url || steps.deployment.outputs.page_url }}
    steps:
      # GitHub Pages sometimes stalls on its side ("deployment_queued" or
      # "try again later"). Try up to three times before reporting a failure.
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
        with:
          timeout: 2400000        # 40 minutes: the site has about 39,000 pages
      - if: steps.deployment.outcome == 'failure'
        run: sleep 90
      - id: retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true
        with:
          timeout: 2400000
      - if: steps.retry.outcome == 'failure'
        run: sleep 180
      - id: last
        if: steps.retry.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          timeout: 2400000
