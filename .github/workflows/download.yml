name: Download data files

# Runs when the confirmed file list changes, or by hand.
on:
  push:
    branches: [main]
    paths:
      - "config/confirmed.yml"
      - "fetch/download.py"
      - ".github/workflows/download.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pyyaml
      - name: Download each file once
        run: python fetch/download.py
      - name: Keep a dated copy as a GitHub release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="raw-$(date -u +%Y-%m-%d)"
          ls fetch/raw >/dev/null 2>&1 || exit 0
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "Original data files, $(date -u +%Y-%m-%d)" \
              --notes "Unchanged copies of the federal source files, as downloaded. See fetch/reports/manifest.md for sizes, dates, and checksums." --prerelease
          gh release upload "$TAG" fetch/raw/* --clobber
      - name: Save the manifest
        if: always()
        run: |
          git config user.name "IDEA Atlas bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fetch/reports
          git diff --cached --quiet || git commit -m "Download manifest [skip ci]"
          git pull --rebase
          git push
