name: Move data tag (one-time)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  move:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          git push --force origin 68b019eba8f1d0d0b591ea61ed2c70f6524f60d5:refs/tags/raw-2026-11-09
          git ls-remote origin refs/tags/raw-2026-11-09
