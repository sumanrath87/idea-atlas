name: Clean and join data

# Pulls the latest original files from the newest "raw-" release,
# then runs the cleaning scripts and saves their reports and outputs.
on:
  push:
    branches: [main]
    paths:
      - "clean/*.py"
      - "config/rules.yml"
      - ".github/workflows/clean.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas openpyxl pyyaml pyogrio geopandas
      - name: Get the original files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(gh release list --limit 20 --json tagName --jq '[.[].tagName | select(startswith("raw-"))] | sort | last')
          mkdir -p fetch/raw
          gh release download "$TAG" --dir fetch/raw --pattern '*'
          ls fetch/raw | wc -l
      - name: Describe file layouts
        run: python clean/profile.py
      - name: Clean and join
        run: |
          if [ -f clean/build_districts.py ]; then python clean/build_districts.py; fi
      - name: Save reports and outputs
        if: always()
        run: |
          git config user.name "IDEA Atlas bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p clean/reports clean/output && touch clean/output/.gitkeep
          git add clean/reports clean/output
          git diff --cached --quiet || git commit -m "Cleaning reports [skip ci]"
          git pull --rebase
          git push
