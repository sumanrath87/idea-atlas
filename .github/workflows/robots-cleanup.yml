name: Publish robots.txt to sumanrath.org

# One-time job: the static robots.txt in the DreamHost web root overrides the one
# WordPress (AIOSEO) generates. This prints it, then renames it to robots.txt.old
# so WordPress serves the managed version. Run by hand only.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retire:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Upload robots.txt
        env:
          DH_HOST: ${{ secrets.DH_HOST }}
          DH_USER: ${{ secrets.DH_USER }}
          DH_PASS: ${{ secrets.DH_PASS }}
          DH_PATH: ${{ secrets.DH_PATH }}
        run: |
          sudo apt-get -qq update && sudo apt-get -qq install -y lftp
          export LFTP_PASSWORD="$(printf '%s' "$DH_PASS" | tr -d '\r\n')"
          DH_USER="$(printf '%s' "$DH_USER" | tr -d '\r\n ')"; DH_HOST="$(printf '%s' "$DH_HOST" | tr -d '\r\n ')"
          lftp --env-password -u "$DH_USER" "sftp://$DH_HOST" -e "set sftp:auto-confirm yes; set net:max-retries 2; \
            cd $DH_PATH; put ops/sumanrath-robots.txt -o robots.txt; chmod 644 robots.txt; cat robots.txt; quit"
